<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>advantage Lucy</title>
  <meta name="description" content="advantage Lucy, indie pop from Tokyo since 1995. Upcoming shows and tickets, setlists from every show, releases, lyrics and news." />
  <!-- Link previews for the bare domain; /en/* and /ja/* pages get their own (functions/lib/meta.ts) -->
  <meta property="og:site_name" content="advantage Lucy" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="advantage Lucy" />
  <meta property="og:description" content="advantage Lucy, indie pop from Tokyo since 1995. Upcoming shows and tickets, setlists from every show, releases, lyrics and news." />
  <meta property="og:image" content="https://new.advantagelucy.com/img/lucy-band-404.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    // Apply the saved theme (or the system one) before first paint
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
